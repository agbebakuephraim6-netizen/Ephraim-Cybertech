<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILL IN THE SPACES TO REGISTER</title>
</head>
<body>
    <form>
        <header>
            <h1>APPLY NOW</h1>
        </header>
        <label for="username">Create a Username</label>
        <input type="text" id="username" placeholder="@ephraimohim" maxlength="10" minlength="6" required><br><br>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Agbebaku Ephraim Ohimai" required><br><br>

        <label for="email">Email<label>
        <input type="email" id="email" placeholder="ephraimagbebaku@gmail.com" required><br><br>

        <label for="phone">Phone Number</label>
        <input id="phone" type="text" placeholder="08133783011" maxlength="11" minlength="11" required><br><br>

        <label for="pin">Enter a Four Digit Pin</label>
        <input id="pin" type="text" placeholder="2010" minlength="4" maxlength="4" required><br><br>

        <label for="qty">Quantity</label>
        <input id="qty" type="number" placeholder="10" required><br><br>

        <label for="dob">Date Of Birth</label>
        <input id="dob" type="date" placeholder="08/31/2010" minlength="12/31/2009" required><br><br>

        <label for="urself">Tell Us About Yourself</label><br>
        <textarea type="text" id="urself" cols="45" rows="5" placeholder="Not Less Than 100 words" minlength="100"></textarea><br><br>

        <p>Verify you are a human</p>
        <label for="fruit">Which of these is a fruit</label>
        <select id="fruit" required="Guava">
            <option value="Rice">Rice</option>
            <option value="Go">Go</option>
            <option value="Come">Come</option>
            <option value="Guava">Guava</option>
        </select><br><br>

        <input type="checkbox" id="click" required>
        <label for="click">click here to subscribe</label><br><br>

        <label for="pic">Upload your picture</label>
        <input type="file" id="pic"><br><br>
        
        <input type="Submit" value="SUBMIT">
        <input type="Reset" value="RESET">
    </form><br><br>

    <button><a href="./index.html">Back</a></button>


<hr />

</body>
</html>
